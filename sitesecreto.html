<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para minha gatinha</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Pacifico & Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBg: '#FFF0F5',
                        pastelPink: '#FFB6C1',
                        pastelDarkPink: '#FF69B4',
                        pastelPurple: '#E6E6FA',
                        pastelDeepPurple: '#B19CD9',
                        softWhite: '#FFFAFA',
                        catDark: '#5A4A42'
                    },
                    fontFamily: {
                        cute: ['Pacifico', 'cursive'],
                        rounded: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF0F5;
            background-image: 
                radial-gradient(#FFC0CB 15%, transparent 16%),
                radial-gradient(#E6E6FA 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            color: #5A4A42;
        }

        /* Floating background elements */
        .bg-element {
            position: absolute;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Cute Card Effect */
        .cute-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 4px solid #FFB6C1;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25), 0 5px 15px rgba(0,0,0,0.05);
        }

        /* Shake animation on wrong answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px) rotate(-2deg); }
            40%, 80% { transform: translateX(12px) rotate(2deg); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        /* Cute Kitty Button */
        .btn-cat {
            position: relative;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #DB7093, 0 10px 20px rgba(255, 105, 180, 0.3);
        }
        .btn-cat:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 9px 0 #DB7093, 0 15px 25px rgba(255, 105, 180, 0.4);
        }
        .btn-cat:active {
            transform: translateY(3px) scale(0.98);
            box-shadow: 0 3px 0 #DB7093, 0 5px 10px rgba(255, 105, 180, 0.4);
        }

        /* Cat Ears on top of Button */
        .cat-ears::before, .cat-ears::after {
            content: '';
            position: absolute;
            top: -14px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 16px solid #FFB6C1;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .cat-ears::before {
            left: 20px;
            transform: rotate(-15deg);
        }
        .cat-ears::after {
            right: 20px;
            transform: rotate(15deg);
        }

        /* Inner Pink Ear */
        .cat-ears-inner::before, .cat-ears-inner::after {
            content: '';
            position: absolute;
            top: -9px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 10px solid #FF69B4;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .cat-ears-inner::before {
            left: 25px;
            transform: rotate(-15deg);
        }
        .cat-ears-inner::after {
            right: 25px;
            transform: rotate(15deg);
        }

        /* Special YouTube Cute Button */
        .btn-yt {
            background: linear-gradient(135deg, #FF4B4B 0%, #FF1493 100%);
            box-shadow: 0 6px 0 #C71585, 0 10px 25px rgba(255, 20, 147, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 6px 0 #C71585, 0 10px 25px rgba(255, 20, 147, 0.4); }
            100% { transform: scale(1.04); box-shadow: 0 8px 0 #C71585, 0 15px 30px rgba(255, 20, 147, 0.6); }
        }

        /* Custom Input styling */
        .cute-input {
            border: 3px solid #FFB6C1;
            transition: all 0.3s ease;
        }
        .cute-input:focus {
            outline: none;
            border-color: #FF69B4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }

        /* Glow Effect for elements */
        .glow-text {
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none">

    <!-- Floating Background Paws and Hearts -->
    <div id="bg-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Main Container -->
    <main class="w-full max-w-lg z-10 my-auto">
        
        <!-- Main Card -->
        <div id="mainCard" class="cute-card rounded-3xl p-6 sm:p-10 text-center relative transition-all duration-500">
            
            <!-- Cute Cat Header Decoration -->
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-white border-4 border-pastelPink rounded-full p-3 shadow-lg">
                <div class="w-16 h-16 bg-pastelPink rounded-full flex items-center justify-center text-3xl text-white">
                    <i class="fa-solid fa-cat animate-bounce"></i>
                </div>
            </div>

            <!-- Title & Header -->
            <div class="mt-6 mb-8">
                <span class="inline-block px-4 py-1 bg-pastelPurple text-pastelDeepPurple font-rounded font-semibold text-xs sm:text-sm rounded-full mb-2 border border-purple-200">
                    <i class="fa-solid fa-sparkles mr-1"></i> 1 Ano de Namoro <i class="fa-solid fa-heart ml-1"></i>
                </span>
                <h1 class="text-2xl sm:text-3xl font-bold font-rounded text-catDark mt-2 glow-text">
                    Qual é a frase secreta?
                </h1>
            </div>

            <!-- Quiz Section (State 1) -->
            <div id="quizSection" class="space-y-5 transition-all duration-300">
                <div class="relative">
                    <input 
                        type="text" 
                        id="secretInput" 
                        placeholder="Digite a frase aqui..." 
                        class="cute-input w-full px-5 py-4 rounded-2xl text-center text-base sm:text-lg font-rounded font-semibold text-catDark bg-pink-50/50 placeholder-pink-300 focus:bg-white"
                        autocomplete="off"
                        onkeypress="handleKeyPress(event)"
                    >
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-pink-300 pointer-events-none">
                        <i class="fa-solid fa-paw text-xl"></i>
                    </div>
                </div>

                <!-- Kitten Verify Button -->
                <button 
                    onclick="checkSecretPhrase()" 
                    class="btn-cat cat-ears cat-ears-inner w-full py-4 rounded-2xl font-rounded font-bold text-lg sm:text-xl flex items-center justify-center gap-2 cursor-pointer mt-4"
                >
                    <span>Verificar Frase</span>
                    <i class="fa-solid fa-heart-circle-check"></i>
                </button>

                <!-- Feedback Message -->
                <div id="feedbackMessage" class="hidden min-h-[32px] flex items-center justify-center gap-2 text-sm sm:text-base font-semibold text-pink-600 bg-pink-100/70 py-2 px-4 rounded-xl border border-pink-200 animate-fadeIn">
                    <!-- Dynamic message goes here -->
                </div>
            </div>

            <!-- Secret Revealed Section (State 2 - Hidden by Default) -->
            <div id="revelationSection" class="hidden space-y-6 animate-fadeIn">
                
                <!-- Success Cute Banner -->
                <div class="bg-gradient-to-r from-pink-100 via-purple-100 to-pink-100 p-5 rounded-2xl border-2 border-dashed border-pink-300">
                    <h2 class="text-xl sm:text-2xl font-bold font-rounded text-pink-600">
                        Você acertou, minha gatinha!
                    </h2>
                    <p class="text-sm text-catDark mt-1 font-medium">
                        Um ano de momentos magicos ao seu lado! 
                    </p>
                </div>

                <!-- 
                    ======================================================
                    COLOQUE SEU LINK DO YOUTUBE AQUI ABAIXO NO ATRIBUTO href
                    ======================================================
                -->
                <a 
                    id="youtubeBtn"
                    href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    onclick="playClickSound()"
                    class="btn-yt btn-cat cat-ears cat-ears-inner w-full py-4 px-6 rounded-2xl font-rounded font-extrabold text-white text-base sm:text-lg flex items-center justify-center gap-3 cursor-pointer shadow-lg transition-transform text-decoration-none block"
                >
                    <i class="fa-brands fa-youtube text-2xl text-white"></i>
                    <span>Assistir Nosso Vídeo Especial</span>
                </a>

                <!-- Reset / Replay Option -->
                <div class="pt-2 flex justify-center gap-3">
                    <button 
                        onclick="resetQuiz()" 
                        class="text-xs text-gray-400 hover:text-pink-500 font-semibold underline flex items-center gap-1 transition-colors"
                    >
                        <i class="fa-solid fa-rotate-left"></i> Tentar novamente
                    </button>
                    <span class="text-xs text-gray-300">•</span>
                    <button 
                        onclick="triggerConfetti()" 
                        class="text-xs text-pink-400 hover:text-pink-600 font-semibold underline flex items-center gap-1 transition-colors"
                    >
                        <i class="fa-solid fa-sparkles"></i> Mais confete!
                    </button>
                </div>

            </div>

            <!-- Bottom Kitty Decoration Footer -->
            <div class="mt-8 pt-4 border-t border-pink-100 flex justify-between items-center text-xs text-pink-300 font-rounded">
                <span><i class="fa-solid fa-paw mr-1"></i> Com todo o meu amor</span>
                <span>1 ano com meu bebe</span>
            </div>

        </div>

    </main>

    <!-- Web Audio API Sound Synthesizer -->
    <script>
        // Web Audio Synthesizer for cute sfx
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // Play cute pop click sound
        function playClickSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) { console.log(e); }
        }

        // Play cute success jingle sound
        function playSuccessSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.12));
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i * 0.12) + 0.25);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + (i * 0.12));
                    osc.stop(audioCtx.currentTime + (i * 0.12) + 0.25);
                });
            } catch(e) { console.log(e); }
        }

        // Play subtle error sound
        function playErrorSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(220, audioCtx.currentTime + 0.2);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) { console.log(e); }
        }
    </script>

    <!-- Interactive Logic & Animations -->
    <script>
        // Target Secret Phrase
        const SECRET_PHRASE = "Feliz 1 ano Bia eu te amo";

        // Generate Floating Background Items (Hearts and Cat Paws)
        function createFloatingElements() {
            const container = document.getElementById('bg-container');
            const icons = ['fa-heart', 'fa-paw', 'fa-star', 'fa-sparkles', 'fa-cat'];
            const colors = ['#FFB6C1', '#FF69B4', '#E6E6FA', '#FFC0CB', '#B19CD9'];
            
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('i');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                el.className = `fa-solid ${randomIcon} bg-element`;
                el.style.left = `${Math.random() * 100}%`;
                el.style.color = randomColor;
                el.style.fontSize = `${Math.random() * 1.5 + 0.8}rem`;
                el.style.animationDuration = `${Math.random() * 6 + 6}s`;
                el.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(el);
            }
        }

        // Helper to normalize text (ignores multiple spaces, punctuation, and upper/lower cases)
        function normalizeText(text) {
            return text
                .trim()
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '') // remove accents
                .replace(/[^a-z0-9\s]/g, '')     // remove punctuation
                .replace(/\s+/g, ' ');           // collapse multiple spaces into one
        }

        // Verify Secret Phrase Function
        function checkSecretPhrase() {
            playClickSound();
            const inputField = document.getElementById('secretInput');
            const userText = normalizeText(inputField.value);
            const targetText = normalizeText(SECRET_PHRASE);
            const card = document.getElementById('mainCard');
            const feedback = document.getElementById('feedbackMessage');

            if (userText === targetText) {
                // SUCCESS!
                playSuccessSound();
                feedback.classList.add('hidden');
                
                // Trigger Visual Celebration
                triggerConfetti();

                // Transition Sections
                document.getElementById('quizSection').classList.add('hidden');
                const revelationSection = document.getElementById('revelationSection');
                revelationSection.classList.remove('hidden');

            } else {
                // WRONG ANSWER
                playErrorSound();
                
                // Shake Animation Effect
                card.classList.remove('shake-animation');
                void card.offsetWidth; // Force reflow
                card.classList.add('shake-animation');

                // Exact error message as requested
                feedback.innerHTML = `<i class="fa-solid fa-paw text-pink-500"></i> <span>Quase lá! Tente de novo.</span>`;
                feedback.classList.remove('hidden');

                // Input focus
                inputField.focus();
            }
        }

        // Handle Enter key on input
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                checkSecretPhrase();
            }
        }

        // Replay / Reset Quiz
        function resetQuiz() {
            playClickSound();
            document.getElementById('secretInput').value = '';
            document.getElementById('feedbackMessage').classList.add('hidden');
            document.getElementById('revelationSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');
        }

        // Trigger Cute Heart & Confetti Explosion
        function triggerConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#FFB6C1', '#FF69B4', '#FF1493']
            });
            fire(0.2, {
                spread: 60,
                colors: ['#E6E6FA', '#FFF0F5', '#FF69B4']
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                colors: ['#FFD1DC', '#FF69B4', '#FFFFFF']
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }

        // Initialize elements on load
        window.addEventListener('DOMContentLoaded', () => {
            createFloatingElements();
        });
    </script>
</body>
</html>
