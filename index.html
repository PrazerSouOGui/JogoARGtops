const FR={};let GP=null,SP=null,WP=[];
function sliceC(im,x,y,w,h){const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,x,y,w,h,0,0,w,h);return c;}
function scaleC(c,k){const o=document.createElement("canvas");o.width=c.width*k;o.height=c.height*k;const x=o.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(c,0,0,o.width,o.height);return o;}
function footOf(c){const d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;for(let y=c.height-1;y>=0;y--)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>40)return y+1;return c.height;}
const PDIR=["S","SE","E","NE","N","NW","W","SW"]; // linhas da folha do protagonista
Object.keys(ASSETS).forEach(k=>{
  const a=ASSETS[k],im=new Image();
  im.onload=()=>{
    if(k==="player"){FR.player={};PDIR.forEach((d,r)=>{FR.player[d]=[];for(let c=0;c<9;c++)FR.player[d].push(sliceC(im,2+23*c,2+36*r,21,34));});}
    else if(k==="water"){WP=[0,1,2,3].map(f=>ctx.createPattern(scaleC(sliceC(im,96*f+16,128,16,16),S),"repeat"));}
    else if(k==="grass"){GP=ctx.createPattern(scaleC(sliceC(im,48,0,48,48),S),"repeat");SP=ctx.createPattern(scaleC(sliceC(im,96,16,16,16),S),"repeat");}
    else{const f=[];for(let i=0;i<a.n;i++)f.push(sliceC(im,i*a.fw,0,a.fw,a.fh));FR[k]=f;FR[k+"Foot"]=a.foot||footOf(f[0]);}
  };
  im.src=a.src;
});
function drawFrame(c,foot,x,y){ctx.imageSmoothingEnabled=false;ctx.drawImage(c,Math.round(x-c.width*S/2),Math.round(y-foot*S),c.width*S,c.height*S);}

/* ===== ENTRADA ===== */
const keys={};
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();if(k==="e"||k==="enter"||k===" ")interact();});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let ptr=null;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
cv.addEventListener("pointerdown",e=>{ptr=e;});
cv.addEventListener("pointermove",e=>{if(ptr)ptr=e;});
addEventListener("pointerup",()=>ptr=null);
document.getElementById("hint").onclick=interact;

function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}
addEventListener("resize",resize);resize();

/* ===== DIÁLOGO ===== */
const dlg=document.getElementById("dlg");
let queue=[],onEnd=null,curName="";
function say(name,lines,end,choices){
  busy=true;queue=lines.slice();onEnd=end;curName=name;nextLine(choices);
}
function nextLine(choices){
  if(!queue.length){dlg.style.display="none";busy=false;if(onEnd)onEnd();return;}
  const t=queue.shift();
  dlg.style.display="block";
  dlg.innerHTML='<div class="who">'+curName+'</div><div>'+t+'</div>';
  if(!queue.length&&choices){
    choices.forEach(c=>{const b=document.createElement("button");b.textContent=c.t;b.onclick=ev=>{ev.stopPropagation();dlg.style.display="none";busy=false;c.f();};dlg.appendChild(b);});
  } else dlg.insertAdjacentHTML("beforeend",'<div class="next">toque ou pressione E &gt;</div>');
}
dlg.addEventListener("click",()=>{ if(busy&&!dlg.querySelector("button"))nextLine(); });

/* ===== INTERAÇÃO ===== */
function near(o,d=110){return Math.hypot(P.x-o.x,P.y-o.y)<d;}
function target(){
  if(near(MAIL))return {t:"mail"};
  for(let i=0;i<NPCS.length;i++)if(near(NPCS[i]))return {t:"npc",i};
  return null;
}
function interact(){
  if(busy){if(!dlg.querySelector("button"))nextLine();return;}
  if(document.getElementById("puz").style.display==="flex")return;
  const g=target();if(!g)return;
  if(g.t==="npc"){
    const n=NPCS[g.i];
    if(g.i<step){say(n.name,n.lines.slice(0,2));return;}
    if(g.i>step){say(n.name,["Ainda não é a minha hora de falar...","Procure outro amigo por aí."]);return;}
    say(n.name,n.lines,()=>{collected.push(n.clue);step++;renderJournal();});
  } else {
    say("Caixa de correio",["Você já tem todas as pistas?"],null,[
      {t:"Sim",f:()=>{ if(collected.length<4) say("Caixa de correio",["Hmm... ainda faltam pistas. Continue explorando!"]); else openPuzzle(); }},
      {t:"Ainda não",f:()=>{}}
    ]);
  }
}
function renderJournal(){
  document.getElementById("jl").innerHTML=collected.length?collected.map(c=>"- "+c.t).join("<br>"):"Nenhuma ainda...";
}

/* ===== QUEBRA-CABEÇA ===== */
const puz=document.getElementById("puz");
let placed=[],deck=[];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){const real=collected.map(c=>c.l);const pool=shuf("ABCDEFGHJKLMNOPQRSTVWXYZ".split("").filter(l=>!real.includes(l))).slice(0,12);return shuf(real.concat(pool));}
function openPuzzle(){
  placed=[];deck=makeDeck();puz.style.display="flex";document.getElementById("msg").textContent="";document.getElementById("end").innerHTML="";drawPuzzle();
}
function drawPuzzle(){
  const s=document.getElementById("slots"),c=document.getElementById("cards");
  s.innerHTML="";c.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");d.className="slot";d.textContent=placed[i]!==undefined?deck[placed[i]]:"";
    d.onclick=()=>{ if(placed.length&&i===placed.length-1){placed.pop();drawPuzzle();} };
    s.appendChild(d);
  }
  deck.forEach((cl,i)=>{
    const d=document.createElement("div");d.className="card"+(placed.includes(i)?" used":"");d.textContent=cl;
    d.onclick=()=>{placed.push(i);drawPuzzle();check();};
    c.appendChild(d);
  });
}
function check(){
  if(placed.length<4)return;
  const word=placed.map(i=>deck[i]).join("");
  const m=document.getElementById("msg");
  if(word==="GUIA"){
    m.textContent="É isso! <3";
    document.getElementById("end").innerHTML='<a class="go" href="'+YT_URL+'" target="_blank" rel="noopener">Abrir o vídeo &gt;</a>';
  } else {
    m.textContent="Hmm... não parece certo. Tente de novo!";
    setTimeout(()=>{placed=[];m.textContent="";drawPuzzle();},1100);
  }
}
document.getElementById("close").onclick=()=>puz.style.display="none";

/* ===== LOOP ===== */
const DIRS={"0,-1":"N","1,-1":"NE","1,0":"E","1,1":"SE","0,1":"S","-1,1":"SW","-1,0":"W","-1,-1":"NW"};
function inLake(x,y){const dx=(x-LAKE.x)/(LAKE.rx+14),dy=(y-LAKE.y)/(LAKE.ry+14);return dx*dx+dy*dy<1;}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let dx=0,dy=0;
  if(!busy&&puz.style.display!=="flex"){
    if(keys.arrowleft||keys.a)dx--;if(keys.arrowright||keys.d)dx++;
    if(keys.arrowup||keys.w)dy--;if(keys.arrowdown||keys.s)dy++;
    if(ptr&&!dx&&!dy){
      const r=cv.getBoundingClientRect();
      const vx=ptr.clientX-r.left-cv.width/2,vy=ptr.clientY-r.top-cv.height/2;
      if(Math.hypot(vx,vy)>20){const a=Math.round(Math.atan2(vy,vx)/(Math.PI/4))*(Math.PI/4);dx=Math.round(Math.cos(a));dy=Math.round(Math.sin(a));}
    }
  }
  P.moving=!!(dx||dy);
  if(dx||dy){
    P.dir=DIRS[dx+","+dy];
    const l=Math.hypot(dx,dy),nx=P.x+dx/l*P.speed*dt,ny=P.y+dy/l*P.speed*dt;
    if(!blocked(nx,P.y))P.x=Math.max(20,Math.min(W-20,nx));
    if(!blocked(P.x,ny))P.y=Math.max(20,Math.min(H-20,ny));
  }
  draw();
  const g=target(),h=document.getElementById("hint");
  h.style.display=g&&!busy&&puz.style.display!=="flex"?"block":"none";
  requestAnimationFrame(loop);
}
function draw(){
  const vw=cv.width,vh=cv.height;
  const camX=Math.max(0,Math.min(W-vw,P.x-vw/2)),camY=Math.max(0,Math.min(H-vh,P.y-vh/2));
  const ox=W<vw?(vw-W)/2:-camX,oy=H<vh?(vh-H)/2:-camY;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#2f6b2f";ctx.fillRect(0,0,vw,vh);
  ctx.translate(Math.round(ox),Math.round(oy));
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=GP||"#81ba44";ctx.fillRect(Math.max(0,-ox),Math.max(0,-oy),vw+2,vh+2);
  ctx.strokeStyle="#1f4d1f";ctx.lineWidth=6;ctx.strokeRect(0,0,W,H);
  // lago
  ctx.fillStyle="#986b41";ctx.beginPath();ctx.ellipse(LAKE.x,LAKE.y,LAKE.rx+14,LAKE.ry+14,0,0,7);ctx.fill();
  ctx.fillStyle="#d7b588";ctx.beginPath();ctx.ellipse(LAKE.x,LAKE.y,LAKE.rx+9,LAKE.ry+9,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(LAKE.x,LAKE.y,LAKE.rx,LAKE.ry,0,0,7);ctx.clip();
  ctx.fillStyle=WP[Math.floor(performance.now()/350)%4]||"#87c7df";ctx.fillRect(LAKE.x-LAKE.rx,LAKE.y-LAKE.ry,LAKE.rx*2,LAKE.ry*2);ctx.restore();
  // praça
  if(FR.plaza){const c=FR.plaza[0];ctx.imageSmoothingEnabled=false;ctx.drawImage(c,Math.round(PLAZA.x-55*S),Math.round(PLAZA.y-42*S),c.width*S,c.height*S);}
  // objetos ordenados por y
  const objs=[{y:MAIL.y,f:()=>{if(!FR.mail)return;const c=FR.mail[0],k=S/2;ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(MAIL.x,MAIL.y,c.width*k*.4,8,0,0,7);ctx.fill();ctx.imageSmoothingEnabled=false;ctx.drawImage(c,Math.round(MAIL.x-c.width*k/2),Math.round(MAIL.y-FR.mailFoot*k),c.width*k,c.height*k);}}];
  NPCS.forEach((n,ni)=>objs.push({y:n.y,f:()=>{const f=FR[n.id];if(!f)return;const fi=Math.floor(performance.now()/1000*ASSETS[n.id].fps+ni*3)%f.length;ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(n.x,n.y,f[0].width*S*.3,7,0,0,7);ctx.fill();drawFrame(f[fi],FR[n.id+"Foot"],n.x,n.y);}}));
  TREES.forEach(t=>{if(FR.tree&&t.x>camX-140&&t.x<camX+vw+140&&t.y>camY&&t.y<camY+vh+260)objs.push({y:t.y,f:()=>drawFrame(FR.tree[0],FR.treeFoot,t.x,t.y)});});
  objs.push({y:P.y,f:()=>{
    if(!FR.player)return;
    const fi=P.moving?1+Math.floor(performance.now()/1000*10)%8:0;
    ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(P.x,P.y,22,7,0,0,7);ctx.fill();
    drawFrame(FR.player[P.dir][fi],34,P.x,P.y);
  }});
  objs.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
}
requestAnimationFrame(loop);
</script>
